<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tambola Housie Picker</title><style>body{font-family:system-ui;background:#101827;color:#fff;margin:0;padding:20px}main{max-width:900px;margin:auto}button,input{font:inherit;padding:10px;border-radius:10px;border:0}button{background:#ffc857;font-weight:bold;cursor:pointer}.board{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin-top:16px}.n{padding:8px 0;text-align:center;background:#29394f;border-radius:7px}.called{background:#ffc857;color:#101827}.card{background:#192538;padding:18px;border-radius:18px;margin:16px 0}.big{font-size:64px;font-weight:800;color:#ffc857;text-align:center}label{display:inline-block;margin:6px}input{width:90px}.prizes{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}.prizes div{background:#101827;padding:10px;border-radius:8px}</style></head><body><main><h1>🎟️ Tambola Housie Picker</h1><p>Random calls, no duplicates, prize split calculator.</p><section class="card"><label>Number range <select id="range"><option>90</option><option>99</option></select></label><div class="big" id="current">—</div><p id="status">Ready to play</p><button id="pick">🎲 Pick next number</button> <button id="undo">Undo</button> <button id="reset">New game</button><p id="count">0 called</p></section><section class="card"><h2>Number Board</h2><div class="board" id="board"></div><h2>Recent calls</h2><p id="history">No calls yet.</p></section><section class="card"><h2>Ticket & Prize Calculator (₹)</h2><label>Ticket price <input id="price" type="number" value="50" min="0"></label><label>Tickets sold <input id="tickets" type="number" value="20" min="0"></label><label>Reserve/expenses <input id="reserve" type="number" value="0" min="0"></label><p>Total collection: <b id="total"></b> · Prize pool: <b id="pool"></b></p><h3>Prize allocation — percentages should total 100%</h3><div class="prizes" id="prizes"></div><p id="pctstatus"></p></section></main><script>let max=90,calls=[];const $=id=>document.getElementById(id),cats=[['First 5',10],['1 Line',15],['2 Lines',15],['3 Lines',20],['Full House',40]];function money(n){return new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:2}).format(n)}function render(){max=+$('range').value;$('board').innerHTML='';for(let i=1;i<=max;i++){let d=document.createElement('div');d.className='n'+(calls.includes(i)?' called':'');d.textContent=i;$('board').append(d)}$('current').textContent=calls.length?calls[calls.length-1]:'—';$('status').textContent=calls.length?'Number '+calls[calls.length-1]+' called':'Ready to play';$('count').textContent=calls.length+' / '+max+' called';$('history').textContent=calls.length?[...calls].reverse().join(' · '):'No calls yet.';$('pick').disabled=calls.length>=max;calc()}function pick(){let left=Array.from({length:max},(_,i)=>i+1).filter(n=>!calls.includes(n));if(left.length)calls.push(left[Math.floor(Math.random()*left.length)]);render()}function calc(){let total=Math.max(0,+$('price').value||0)*Math.max(0,+$('tickets').value||0),reserve=Math.max(0,+$('reserve').value||0),pool=Math.max(0,total-reserve);$('total').textContent=money(total);$('pool').textContent=money(pool);let sum=0;$('prizes').innerHTML='';cats.forEach((c,i)=>{let d=document.createElement('div');d.innerHTML='<label>'+c[0]+' % <input type="number" min="0" max="100" value="'+c[1]+'" data-i="'+i+'"></label><p><b id="amount'+i+'"></b></p>';$('prizes').append(d);sum+=c[1]});document.querySelectorAll('[data-i]').forEach(el=>el.addEventListener('input',updatePrize));updatePrize()}function updatePrize(){let total=0;document.querySelectorAll('[data-i]').forEach(el=>{let pct=Math.max(0,+el.value||0);total+=pct;$('amount'+el.dataset.i).textContent=money(Math.max(0,(Math.max(0,+$('price').value||0)*Math.max(0,+$('tickets').value||0)-Math.max(0,+$('reserve').value||0))*pct/100))});$('pctstatus').textContent='Prize percentages total '+total+'%'+(total===100?' ✓':' — adjust to 100%.')} $('pick').onclick=pick;$('undo').onclick=()=>{calls.pop();render()};$('reset').onclick=()=>{calls=[];render()};$('range').onchange=()=>{calls=[];render()};['price','tickets','reserve'].forEach(id=>$(id).oninput=calc);render();</script></body></html>
